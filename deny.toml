# CI checks the dependency tree with `cargo deny --all-features --locked check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory, including unmaintained and unsound crates,
# anywhere in the tree. Ignoring one needs an entry here with a reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # chrono is unmaintained and has no fixed version. It comes in through
    # arrow and parquet, which the `parquet` feature of buzzard-tdms uses for
    # the Parquet export. buzzard passes no date or time text to it. Remove
    # this entry when arrow drops chrono.
    { id = "RUSTSEC-2026-0543", reason = "comes in through arrow and parquet, and no fixed version exists" },
]

[licenses]
# Permissive licenses compatible with distributing an Apache-2.0 binary.
allow = [
    "Apache-2.0",
    # The encoding tables of encoding_rs come from WHATWG under BSD-3-Clause.
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicate versions come from third-party crates and cannot always be
# avoided. cargo-deny reports them without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
