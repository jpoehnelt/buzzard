name: Release

# This workflow publishes the crates to crates.io. It starts by hand only. It
# has no push, pull request, tag, or schedule trigger, so nothing a
# contributor does can start it. See RELEASING.md for the steps around it.
on:
  workflow_dispatch:
    inputs:
      crates:
        description: "Which crates: tdms (buzzard-tdms alone) or all (the six, in dependency order)"
        type: choice
        options: [tdms, all]
        default: tdms
        required: true
      dry_run:
        description: "Dry run: package and verify, upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

# One release runs at a time, and a run is never cancelled halfway through a
# list of crates.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # This job runs every job of ci.yml on the commit being released. The
  # `package` job of ci.yml builds each crate from its packaged files.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # This job does what `cargo publish` would do, without the upload. It has no
  # access to crates.io, because it requests no token and `id-token` is not
  # granted.
  dry-run:
    if: ${{ inputs.dry_run }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Package and verify without uploading
        env:
          CRATE_SET: ${{ inputs.crates }}
        run: |
          set -euo pipefail
          case "$CRATE_SET" in
            tdms) selection=(-p buzzard-tdms) ;;
            all) selection=(--workspace) ;;
            *) echo "::error::unknown crate set '$CRATE_SET'"; exit 1 ;;
          esac
          cargo publish --dry-run --locked "${selection[@]}"
          # `cargo publish --dry-run` leaves no .crate file in
          # target/package, and `cargo package` does. The build was verified
          # above, so this command only writes the files for the table.
          rm -rf target/package
          cargo package --no-verify --locked "${selection[@]}"
          shopt -s nullglob
          files=(target/package/*.crate)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::cargo package left no .crate file in target/package"
            exit 1
          fi
          {
            echo "### Dry run: nothing was uploaded"
            echo
            echo "| Package | Bytes | Files |"
            echo "| --- | --- | --- |"
            for file in "${files[@]}"; do
              bytes=$(stat -c %s "$file")
              count=$(tar -tzf "$file" | wc -l)
              echo "| $(basename "$file") | $bytes | $count |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # This job uploads. It skips a version that crates.io already has, so a run
  # that failed halfway can be started again.
  publish:
    if: ${{ !inputs.dry_run }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The trusted publisher of each crate on crates.io names this workflow
    # file and this environment. Give the environment required reviewers and
    # restrict it to `main` in the repository settings.
    environment: release
    permissions:
      contents: read
      # This permission lets the job ask GitHub for the OIDC token that
      # crates.io exchanges for a publish token.
      id-token: write
    steps:
      - name: Refuse to publish from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases are published from main, not from $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # This action is Trusted Publishing. It exchanges the job's OIDC token
      # for a crates.io token that lasts 30 minutes, and revokes that token
      # when the job ends. It works only for a crate that already exists on
      # crates.io and has this workflow as a trusted publisher (RELEASING.md,
      # "The first release of a crate").
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish in dependency order
        env:
          CRATE_SET: ${{ inputs.crates }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          case "$CRATE_SET" in
            tdms) crates="buzzard-tdms" ;;
            # A crate comes after every crate it depends on.
            all) crates="buzzard-rsrc buzzard-tdms buzzard-lint buzzard-ls buzzard-mcp buzzard-cli" ;;
            *) echo "::error::unknown crate set '$CRATE_SET'"; exit 1 ;;
          esac

          metadata=$(cargo metadata --no-deps --format-version 1 --locked)

          # Returns whether crates.io has this version, as the sparse index
          # says. The index entry of a crate has one JSON object per line
          # and per version, yanked versions included. The names are longer
          # than three characters, so the path is the first two characters,
          # the next two, then the name.
          published() {
            local name=$1 version=$2 status
            status=$(curl --silent --show-error --retry 3 --output index.json \
              --write-out '%{http_code}' \
              "https://index.crates.io/${name:0:2}/${name:2:2}/${name}")
            case "$status" in
              200) ;;
              404) return 1 ;;
              *) echo "::error::the crates.io index answered $status for $name"; exit 1 ;;
            esac
            # jq exits with 0 for a match and 4 for none. Any other status
            # (a body that is not JSON, a missing jq) is not an answer, and
            # the release stops instead of taking it for "not published".
            # The `|| status=$?` keeps a 4 from ending the script when the
            # function is called outside an `if`.
            if [ ! -s index.json ]; then
              echo "::error::the crates.io index answered 200 with no content for $name"
              exit 1
            fi
            status=0
            jq --exit-status --arg v "$version" 'select(.vers == $v)' index.json > /dev/null || status=$?
            case "$status" in
              0) return 0 ;;
              4) return 1 ;;
              *) echo "::error::the crates.io index entry of $name could not be read (jq status $status)"; exit 1 ;;
            esac
          }

          for name in $crates; do
            version=$(jq --raw-output --arg n "$name" \
              '.packages[] | select(.name == $n) | .version' <<< "$metadata")
            test -n "$version"
            if published "$name" "$version"; then
              echo "::notice::$name $version is already on crates.io and was skipped"
              echo "- $name $version: already published, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # The `package` job of the checks built this crate from its
            # packaged files, so the upload does not build it again. The
            # token would not outlive six builds. cargo waits up to a
            # minute for the index to list the new version. If the index
            # takes longer, the next crate fails to resolve it. Run the
            # workflow again, and it skips the uploaded versions.
            cargo publish --locked --no-verify -p "$name"
            echo "- $name $version: published" >> "$GITHUB_STEP_SUMMARY"
          done
